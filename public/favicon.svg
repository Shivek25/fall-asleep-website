<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="50" cy="50" r="50" />
    </clipPath>
    <mask id="moon-mask">
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <circle cx="62" cy="38" r="40" fill="black" />
    </mask>
  </defs>
  
  <g clip-path="url(#circle-clip)">
    <!-- Dark teal background (top right half) -->
    <rect x="0" y="0" width="100" height="100" fill="#0c1f24" />
    
    <!-- Navy background (bottom left half) -->
    <path d="M 0 0 L 100 100 L 0 100 Z" fill="#0b3155" />
    
    <!-- Crescent Moon -->
    <circle cx="45" cy="55" r="38" fill="#e5f8f5" mask="url(#moon-mask)" />
    
    <!-- Moon Craters (subtle dark spots) -->
    <circle cx="28" cy="55" r="2.5" fill="#84a6a1" opacity="0.8"/>
    <circle cx="35" cy="72" r="2" fill="#84a6a1" opacity="0.8"/>
    <circle cx="30" cy="35" r="4" fill="#84a6a1" opacity="0.8"/>
    
    <!-- Large Cross Stars -->
    <path d="M 85 25 Q 85 30 80 30 Q 85 30 85 35 Q 85 30 90 30 Q 85 30 85 25 Z" fill="#e5f8f5" />
    <path d="M 27 82 Q 27 87 20 87 Q 27 87 27 92 Q 27 87 34 87 Q 27 87 27 82 Z" fill="#e5f8f5" />
    
    <!-- Tiny Cross Star -->
    <path d="M 73 15 Q 73 17 71 17 Q 73 17 73 19 Q 73 17 75 17 Q 73 17 73 15 Z" fill="#e5f8f5" />
    
    <!-- Round Stars -->
    <circle cx="65" cy="30" r="2" fill="#e5f8f5" />
    <circle cx="55" cy="42" r="2.5" fill="#84a6a1" />
    <circle cx="42" cy="24" r="1.5" fill="#e5f8f5" />
    <circle cx="70" cy="60" r="1.5" fill="#84a6a1" />
    <circle cx="65" cy="40" r="1" fill="#e5f8f5" opacity="0.6" />
    <circle cx="52" cy="20" r="1" fill="#e5f8f5" opacity="0.5" />
    <circle cx="50" cy="55" r="0.8" fill="#e5f8f5" opacity="0.8" />
  </g>
</svg>
